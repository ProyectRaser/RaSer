name: Java CI with Gradle

on:
  push:
    branches: [ "sergi" ]
  pull_request:
    branches: [ "sergi" ]

jobs:
  setup:
    uses: ./.github/workflows/reusableworkflows.yml
    with:
      java-version: '17'

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Move test results
        run: 
          if [ -d "app/build/test-results/testDebugUnitTest" ]; then
          mv app/build/test-results/testDebugUnitTest/ $GITHUB_WORKSPACE/reports/
          else
          echo "Test results directory does not exist"
          exit 1
            fi

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/ 

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project and APK
        run: ./gradlew build assembleDebug

      - name: Run unit tests (Android)
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks

  coverage:
    needs: [setup, build]
    runs-on: ubuntu-latest
    name: Generate & Upload JaCoCo Coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests again (for coverage)
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport --rerun-tasks

      - name: Verificar si se generó el reporte
        run: |
          echo "Buscando HTML de cobertura..."
          find app/build/reports/jacoco/ -type f -name "index.html" || echo "No se encontró index.html"

      - name: Upload coverage report (si existe)
        if: success() && hashFiles('app/build/reports/jacoco/test/html/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/test/html

  sonarcloud-analysis:
    needs: [setup, coverage]
    runs-on: ubuntu-latest
    name: Análisis SonarCloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project (necesario para SonarCloud)
        run: ./gradlew :app:assembleDebug

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=ProyectRaser_RaSer
            -Dsonar.organization=proyectraser
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml

  security-analysis:
    needs: [setup, sonarcloud-analysis]
    name: Análisis de vulnerabilidades con Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build project (necesario para Snyk)
        run: ./gradlew :app:assembleDebug

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk CLI
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk test for vulnerabilities
        run: snyk test --all-projects --org=raser
        continue-on-error: true

      - name: Run Snyk monitor for vulnerabilities
        run: snyk monitor --all-projects --org=raser

  publish-artifacts:
    needs: [setup, security-analysis]
    name: Subir APK a GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        run: ./gradlew :app:assembleDebug  

      - name: List files in the directory
        run: ls -R app/build/outputs/apk/debug  

      - name: Check if APK exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found!"
            exit 1
          fi
          

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      

      - name: Build AAB
        run: ./gradlew :app:bundleRelease
    

      - name: Upload ABB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/release/app-release.aab

  docker-release:
    needs: publish-artifacts
    name: Publicar imagen Docker optimizada
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk-context

      - name: Copy Dockerfile.apk into context
        run: cp Dockerfile.apk apk-context/Dockerfile

      - name: Build and push Docker image
        run: |
          docker build \
            --file apk-context/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/android-apk-builder:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/android-apk-builder:${{ github.run_number }} \
            apk-context

          docker push ${{ secrets.DOCKER_USERNAME }}/android-apk-builder:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/android-apk-builder:${{ github.run_number }}


  firebase-upload:
    needs: publish-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

    # Configurar Firebase CLI
      - name: Set up Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
        shell: bash

    # Autenticación con Firebase usando el archivo de credenciales
      - name: Authenticate with Firebase
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS_JSON }}" > firebase-credentials.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json

    # Descargar el APK desde el artefacto
      - name: Download APK from previous job
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ./apk

    # Subir el APK a Firebase App Distribution
      - name: Upload APK to Firebase App Distribution
        run: |
         firebase appdistribution:distribute ./apk/app-debug.apk --app 1:482922853874:android:dfaed24364bf771311276b --testers "proyectraser@gmail.com" --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  dependency-submission:
    needs: docker-release
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4

 

