apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fastapi-rules
  namespace: monitoring
  labels:
    release: kube-prometheus         
    prometheus: kube-prometheus     
spec:
  groups:
    - name: fastapi.rules
      rules:
        - alert: HighCpuUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="default", container!=""}[1m])) 
            by (pod) > 0.1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Alta CPU en pod {{ $labels.pod }}"
            description: "El pod {{ $labels.pod }} está usando más del 80% de CPU durante más de 1 minuto."
