apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  labels:
    app: fastapi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: fastapi
          image: proyectraser/fastapi-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          volumeMounts:
            - mountPath: /app/data
              name: fastapi-storage
            - mountPath: /app/firebase_key
              name: firebase-key
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: fastapi-storage
          persistentVolumeClaim:
            claimName: fastapi-pvc
        - name: firebase-key
          secret:
            secretName: firebase-key-secret
