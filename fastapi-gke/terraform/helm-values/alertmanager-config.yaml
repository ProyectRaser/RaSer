alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: '#canal-alertas'
            send_resolved: true
            webhook_url: 'https://hooks.slack.com/services/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'
